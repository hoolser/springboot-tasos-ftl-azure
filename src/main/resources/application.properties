spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.suffix=.ftl
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Local file storage configuration
local-storage-path=${user.home}/tasos-storage

# Translation provider configuration: deepl or azure
srt.translation.provider=${SRT_TRANSLATION_PROVIDER:deepl}

# DeepL Translation API Configuration
# Get your API key from https://www.deepl.com/pro-api
deepl.api.key=${DEEPL_API_KEY:}

# Azure Translator API Configuration
# Endpoint example: https://api.cognitive.microsofttranslator.com
azure.translator.endpoint=${AZURE_TRANSLATOR_ENDPOINT:https://api.cognitive.microsofttranslator.com}
azure.translator.key=${AZURE_TRANSLATOR_KEY:}
# Region is required for regional resources (for example: westeurope)
azure.translator.region=${AZURE_TRANSLATOR_REGION:}

# SRT Translation Batch Size Strategy (IMPORTANT):
# ================================================
#
# DeepL (6 items per batch):
#   - Smaller batches provide better context for gender agreement & grammar
#   - Good for quality-focused translations
#   - ~6-8 requests for 100 subtitles
#
# Azure (50 items per batch):
#   - LARGER batches = FEWER requests = avoid 429 rate limit errors
#   - Azure Translator supports up to 100 items per request
#   - Reduces request frequency from ~16 to 2 requests for 100 subtitles
#   - Minimizes 429 "Too Many Requests" errors
#   - Still provides reasonable translation context
#   - Azure charges per character, not per request (cost-efficient)
#
# Rate Limiting & Retry:
# - Azure: 500ms delay between requests + exponential backoff (1s, 2s, 4s) on 429 errors
# - Free tier: 2 requests/second
# - Standard tier: 10 requests/second

##TODO remove this when starting using profiles in the actual VM on google gloud.
### Database Configuration
spring.datasource.url=jdbc:mysql://
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

server.forward-headers-strategy=native
